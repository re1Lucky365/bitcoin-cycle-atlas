name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test before deployment
        run: npm test
      - name: Verify the published calibration and chart performance gate
        run: |
          npm run verify:cycle
          npm run verify:performance
      - name: Verify static paths and standalone build
        run: |
          node scripts/verify-static.mjs
          node scripts/build-standalone.mjs build/Bitcoin_Cycles_Comparison.html
          node scripts/verify-static.mjs --standalone build/Bitcoin_Cycles_Comparison.html
      # This is a ready-to-serve static site. Pages must use GitHub Actions as
      # its repository source; configure-pages is not needed to transform it.
      - name: Upload only public site files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
