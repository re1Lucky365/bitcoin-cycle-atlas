name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve the release version from this exact source
        id: version
        run: |
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          const {version}=JSON.parse(await readFile('package.json','utf8'));
          const tag=`v${version}`;
          if(process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME!==tag)throw new Error('Tag/version mismatch');
          await appendFile(process.env.GITHUB_OUTPUT,`tag=${tag}\n`);
          NODE
      - name: Test release source
        run: npm test
      - name: Verify research catalog and preserved Markdown
        run: npm run verify:research
      - name: Independently reconcile daily treasury paths
        run: npm run verify:treasury-paths
      - name: Verify bounded request ownership and negative controls
        run: npm run verify:formal
      - name: Verify and package release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/verify-static.mjs
          node scripts/package-release.mjs --tag "$RELEASE_TAG"
          cd release/assets
          sha256sum --check SHA256SUMS.txt
      - name: Publish or resume this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A release and every asset must name this exact tested commit.
          # Resolve annotated tags to their peeled commit and never retag.
          tag_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_sha=""
          while read -r oid ref; do
            if [[ "$ref" == "refs/tags/$RELEASE_TAG^{}" ]]; then tag_sha="$oid"; break; fi
            tag_sha="$oid"
          done <<< "$tag_refs"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag names a different source commit; publish a new version." >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          mapfile -t assets < release/ASSETS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun never creates a second release. Identical assets are
            # skipped; missing assets are uploaded. Existing differing assets
            # fail clearly instead of deleting published or immutable assets.
            check_dir="$(mktemp -d)"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$check_dir" 2>/dev/null; then
                cmp "$asset" "$check_dir/$name" || { echo "Existing asset differs: $name. Publish a new tag." >&2; exit 1; }
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          fi
