name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release source
        run: npm test
      - name: Verify and package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/verify-static.mjs
          node scripts/package-release.mjs --tag "$RELEASE_TAG"
          cd release/assets
          sha256sum --check SHA256SUMS.txt
      - name: Publish or resume this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < release/ASSETS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun never creates a second release. Identical assets are
            # skipped; missing assets are uploaded. Existing differing assets
            # fail clearly instead of deleting published or immutable assets.
            check_dir="$(mktemp -d)"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$check_dir" 2>/dev/null; then
                cmp "$asset" "$check_dir/$name" || { echo "Existing asset differs: $name. Publish a new tag." >&2; exit 1; }
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          fi
